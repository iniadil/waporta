services:
  app:
    build: .
    container_name: waporta
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./data/baileys_store.db:/app/baileys_store.db
      - ./data/wa_credentials:/app/wa_credentials
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DASHBOARD_USERNAME=${DASHBOARD_USERNAME:-admin}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-changeme}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-waporta@localhost}
      - NOTIFY_EMAIL=${NOTIFY_EMAIL:-}
      - NOTIFY_WEBHOOK_URL=${NOTIFY_WEBHOOK_URL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
